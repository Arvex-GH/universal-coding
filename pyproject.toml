[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-coding-language"
version = "0.4.0"
description = "UCL: bracket-based plain-English applications"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["waitress==3.0.2"]

[project.scripts]
ucl = "ucl.__main__:main"

[tool.setuptools.packages.find]
include = ["ucl*"]
