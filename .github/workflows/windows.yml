name: Windows distribution
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          python -m pip install -e . -r packaging/requirements.txt
          npm install --global @vscode/vsce@3.6.2
      - name: Test language
        run: python -m unittest discover -s tests -v
      - name: Freeze standalone UCL (includes Tk and SQLite)
        run: python packaging/build.py
      - name: Smoke test standalone CLI
        run: python packaging/smoke.py dist/ucl/ucl.exe
      - name: Build installers
        shell: pwsh
        run: |
          $version = python -c "from ucl import __version__; print(__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 is required on the runner' }
          & $iscc /DAppVersion=0.1.0 /DOutputBase=ucl-test-old packaging/windows/ucl-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc "/DAppVersion=$version" packaging/windows/ucl-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test install, upgrade, PATH, and uninstall
        run: python packaging/windows/test_installer.py
      - name: Package VS Code extension
        working-directory: editors/vscode
        run: vsce package --allow-missing-repository --out ../../dist/ucl-language.vsix
      - name: Prepare release assets and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ucl -DestinationPath dist/ucl-windows-x64.zip
          Remove-Item dist/ucl-test-old.exe
          $names = @('ucl-installer.exe', 'ucl-windows-x64.zip', 'ucl-language.vsix')
          $lines = foreach ($name in $names) {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ucl-windows-x64
          path: |
            dist/ucl-installer.exe
            dist/ucl-windows-x64.zip
            dist/ucl-language.vsix
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ucl-windows-x64
          path: release-assets
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "from ucl import __version__; print(__version__)")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite published binaries. Bump the version for a new release."
            exit 0
          fi
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "UCL $version" --notes-file docs/release-notes.md --latest
